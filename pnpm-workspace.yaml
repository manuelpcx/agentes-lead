# Autoriza a estos paquetes a ejecutar sus build scripts (pnpm 10+ los bloquea
# por defecto). Prisma los necesita para descargar sus engines.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  msgpackr-extract: true
  prisma: true
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - '@nestjs/core'
  - msgpackr-extract

# Parches de seguridad en dependencias transitivas, dentro de la misma linea
# mayor que ya usan @nestjs/platform-express 10.4 / express 4 (ver pnpm audit).
overrides:
  multer: ">=2.3.0"
  lodash: ">=4.17.24"
  qs: ">=6.16.0"
  body-parser: ">=1.20.6 <2"
